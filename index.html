<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
    <title>Russisch Trainer V16</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --sub: #8E8E93;
            --danger: #FF3B30;
            --success: #34C759;
            --gold: #FFB300;
            --field: #E5E5EA;
            --line: #EFEFF4;
            --selected-bg: #E8F2FF;
            --matched-bg: #E5F9E7;
            --radius: 14px;
            --shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #0A84FF;
                --bg: #000000;
                --card: #1C1C1E;
                --text: #F2F2F7;
                --sub: #98989F;
                --danger: #FF453A;
                --success: #30D158;
                --field: #2C2C2E;
                --line: #2C2C2E;
                --selected-bg: #0A2A4D;
                --matched-bg: #0F3D1C;
                --shadow: none;
            }
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        input, select {
            user-select: text;
            -webkit-user-select: text;
            font-size: 16px; /* verhindert Auto-Zoom auf iOS */
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        /* NAVIGATION MIT SAFE-AREA */
        .nav-tabs {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: 8px;
            padding-right: 8px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 200;
        }
        .tab-btn {
            flex: 1;
            height: 46px;
            border: none;
            background: transparent;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--sub);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0 4px;
        }
        .tab-btn.active {
            color: var(--primary);
            font-weight: 700;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }
        .badge {
            background: var(--danger);
            color: white;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
        }

        /* CONTENT */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 14px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
            overflow-y: auto;
        }
        .tab-content.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-shrink: 0;
            background: var(--card);
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        .header-title { font-weight: 700; font-size: 15px; }
        .header-sub { color: var(--sub); font-size: 12px; }

        /* SPIELKARTEN */
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: minmax(62px, 72px);
            gap: 10px;
            align-content: start;
            width: 100%;
        }
        .card {
            appearance: none;
            -webkit-appearance: none;
            font: inherit;
            color: var(--text);
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-align: center;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: transform 0.1s ease, border-color 0.12s ease, background-color 0.12s ease, opacity 0.2s ease;
            touch-action: manipulation;
            padding: 6px 10px;
            height: 100%;
            width: 100%;
            animation: fadeIn 0.2s ease backwards;
        }
        .card:active {
            transform: scale(0.96);
        }
        .card.selected {
            border-color: var(--primary);
            background-color: var(--selected-bg);
        }
        .card.matched {
            background-color: var(--matched-bg);
            border-color: var(--success);
            opacity: 0.2;
            pointer-events: none;
            transform: scale(0.95);
        }
        .card.error {
            background-color: var(--danger);
            border-color: var(--danger);
            animation: shake 0.35s;
        }
        .card.error .card-text,
        .card.error .speaker-icon,
        .card.error .card-badge {
            color: #FFF !important;
        }
        .card-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.2;
            word-break: break-word;
        }
        .speaker-icon {
            color: var(--sub);
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }
        .card.selected .speaker-icon {
            color: var(--primary);
        }
        .card-badge {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--danger);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 18px;
            font: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn.big { padding: 12px; }
        .btn.grey { background: #8E8E93; }
        .btn.red { background: var(--danger); }

        .empty-hint {
            border: 2px dashed var(--field);
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            color: var(--sub);
            font-size: 14px;
            margin-top: 10px;
        }

        /* VOKABELLISTE */
        .list-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .list-controls input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: none;
            background: var(--field);
            color: var(--text);
            border-radius: 10px;
        }
        .list-controls select {
            padding: 0 10px;
            border: none;
            background: var(--card);
            border-radius: 10px;
            font-weight: 600;
            color: var(--text);
        }
        .vocab-list {
            background: var(--card);
            border-radius: var(--radius);
            overflow-y: auto;
            box-shadow: var(--shadow);
            flex: 1;
        }
        .vocab-item {
            padding: 11px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .vocab-item small { color: var(--sub); }
        .list-info {
            padding: 10px 14px;
            font-size: 12px;
            color: var(--sub);
            text-align: center;
        }
        .box-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--field);
            color: var(--sub);
            margin-left: 6px;
            font-weight: 600;
        }
        .box-badge.master {
            background: var(--gold);
            color: #fff;
        }
        .err-pill {
            background: var(--danger);
            color: #fff;
            padding: 4px 9px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* PROFIL */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: var(--card);
            padding: 16px 12px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-num {
            font-size: 26px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 11px;
            color: var(--sub);
            font-weight: 600;
        }
        .stat-row {
            margin-top: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 14px;
        }
        .stat-row strong {
            display: block;
            font-size: 20px;
            margin-top: 2px;
        }
        .divider { height: 30px; width: 1px; background: var(--field); }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-row .btn { flex: 1; }
        .profile-actions {
            margin-top: auto;
            gap: 10px;
            display: flex;
            flex-direction: column;
            padding-top: 16px;
        }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(28,28,30,0.92);
            color: white;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 999;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<nav class="nav-tabs">
    <button class="tab-btn active" data-tab="game" onclick="app.switchTab('game')">Spiel</button>
    <button class="tab-btn" data-tab="weak" onclick="app.switchTab('weak')">
        Training <span id="weakBadge" class="badge" style="display:none">0</span>
    </button>
    <button class="tab-btn" data-tab="manage" onclick="app.switchTab('manage')">Liste</button>
    <button class="tab-btn" data-tab="stats" onclick="app.switchTab('stats')">Profil</button>
</nav>

<div class="content-area">
    <!-- TAB 1: SPIEL -->
    <div id="tab-game" class="tab-content active">
        <div class="game-header">
            <div>
                <div class="header-title" id="gameProgress">0 / 5 Paare</div>
                <div class="header-sub" id="roundSubtext">Runde 1</div>
            </div>
            <button class="btn" onclick="app.startNewGame('normal')">Überspringen ↻</button>
        </div>
        <div id="gameBoard" class="game-grid"></div>
    </div>

    <!-- TAB 2: FEHLER-TRAINING -->
    <div id="tab-weak" class="tab-content">
        <div class="game-header">
            <div>
                <div class="header-title">Fehler-Training</div>
                <div class="header-sub" id="weakCountDisplay">0 Wörter mit Fehlern</div>
            </div>
            <button class="btn" onclick="app.startNewGame('weak')">Neu mischen ▶</button>
        </div>
        <div id="weakBoard" class="game-grid"></div>
        <div id="weakEmptyHint" class="empty-hint">
            Sobald du im Spiel ein Wortpaar verwechselst, wird es hier gespeichert und kann gezielt geübt werden.
        </div>
    </div>

    <!-- TAB 3: LISTE -->
    <div id="tab-manage" class="tab-content">
        <div class="list-controls">
            <input type="search" id="searchInput" placeholder="Wort suchen..." autocomplete="off" autocapitalize="off" oninput="app.renderVocabList()">
            <select id="filterSelect" onchange="app.renderVocabList()">
                <option value="all">Alle (Fehler zuerst)</option>
                <option value="errors">Nur Fehler</option>
                <option value="learning">In Arbeit (Box 1–4)</option>
                <option value="master">Meister (Box 5)</option>
                <option value="new">Noch neu</option>
            </select>
        </div>
        <div class="vocab-list" id="vocabListContainer"></div>
    </div>

    <!-- TAB 4: PROFIL -->
    <div id="tab-stats" class="tab-content">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-num" style="color:var(--primary)" id="statTotalWords">0</span>
                <span class="stat-label">VOKABELN GESAMT</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" style="color:var(--gold)" id="statMastered">0</span>
                <span class="stat-label">MEISTER (BOX 5)</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" style="color:var(--success)" id="statRounds">0</span>
                <span class="stat-label">RUNDEN ABGESCHLOSSEN</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" style="color:var(--danger)" id="statErrors">0</span>
                <span class="stat-label">FEHLER GESAMT</span>
            </div>
        </div>

        <div class="stat-card stat-row">
            <div>
                <span class="stat-label">GELERNT (BOX ≥ 1)</span>
                <strong id="statStarted">0</strong>
            </div>
            <div class="divider"></div>
            <div>
                <span class="stat-label">GELÖSTE PAARE</span>
                <strong id="statPairsFound">0</strong>
            </div>
            <div class="divider"></div>
            <div>
                <span class="stat-label">FEHLER-WÖRTER</span>
                <strong id="statOpenWeak" style="color:var(--danger)">0</strong>
            </div>
        </div>

        <div class="stat-card" style="margin-top:10px">
            <span class="stat-label">BACKUP</span>
            <div class="btn-row">
                <button class="btn" onclick="app.exportData()">Exportieren</button>
                <button class="btn" onclick="document.getElementById('importFile').click()">Importieren</button>
            </div>
            <input type="file" id="importFile" accept="application/json,.json" hidden onchange="app.importData(this)">
        </div>

        <div class="profile-actions">
            <button class="btn big grey" onclick="app.resetStats()">Lernfortschritt zurücksetzen</button>
            <button class="btn big red" onclick="app.hardReset()">Kompletten Speicher löschen</button>
        </div>
    </div>
</div>

<div id="toast"></div>

// Schlüssel bewusst beibehalten, damit vorhandener Fortschritt erhalten bleibt
const STORAGE_KEY = 'ru_trainer_v15_pro';
const OLD_KEYS = ['ru_trainer_v14_smart', 'ru_trainer_v13_hardened'];

const PAIRS_PER_ROUND = 5;
const MIN_WEAK_PAIRS = 3;
// Leitner-Intervalle: nach wie vielen Runden ein Wort aus Box n wieder fällig ist
const BOX_INTERVALS = [0, 2, 4, 8, 20, 50];

const SPEAKER_SVG = `<svg class="speaker-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;

// ё und е gleich behandeln, damit alter Fortschritt zu korrigierten Wörtern passt
const norm = s => String(s).trim().toLowerCase().replace(/ё/g, 'е');

// Bedeutungs-Bausteine: Wörter mit gemeinsamem Baustein kommen nie in dieselbe Runde
const meaningTokens = en => en.toLowerCase().split(/[,/;()]/).map(s => s.trim()).filter(Boolean);

const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
};

const newSession = boardId => ({
    boardId,
    cards: [],
    selected: null,
    locked: false,
    matches: 0,
    totalPairs: 0,
    gameId: 0,
    nextTimer: null
});

const app = {
    data: {
        vocab: [],
        stats: { rounds: 0, completed: 0, pairsFound: 0, totalErrors: 0, gameSeq: 0 }
    },
    byKey: new Map(),
    sessions: {
        normal: newSession('gameBoard'),
        weak: newSession('weakBoard')
    },
    voice: null,
    voiceWarned: false,
    saveWarned: false,
    toastTimer: null,

    /* ---------- LADEN & SPEICHERN ---------- */

    loadRaw() {
        try {
            const current = localStorage.getItem(STORAGE_KEY);
            if (current) return current;
            for (const k of OLD_KEYS) {
                const old = localStorage.getItem(k);
                if (old) return old;
            }
        } catch (e) {
            console.warn('localStorage nicht verfügbar:', e);
        }
        return null;
    },

    init() {
        const raw = this.loadRaw();
        const saved = new Map();

        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                const s = parsed.stats || {};
                this.data.stats = {
                    rounds: Number(s.rounds) || 0,
                    completed: Number(s.completed) || 0,
                    pairsFound: Number(s.pairsFound) || 0,
                    totalErrors: Number(s.totalErrors) || 0,
                    gameSeq: Number(s.gameSeq) || 0
                };
                if (Array.isArray(parsed.vocab)) {
                    parsed.vocab.forEach(v => {
                        if (v && v.russian) saved.set(norm(v.russian), v);
                    });
                }
            } catch (e) {
                console.warn('Fehler beim Laden:', e);
            }
        }

        const seen = new Set();
        this.data.vocab = [];
        RAW_VOCAB.forEach(([ru, en], idx) => {
            const key = norm(ru);
            if (seen.has(key)) return;
            seen.add(key);
            const prev = saved.get(key) || {};
            const word = {
                russian: String(ru).trim(),
                english: String(en).trim(),
                key,
                rank: idx,
                tokens: meaningTokens(String(en)),
                errors: Math.max(0, Number(prev.errors) || 0),
                box: Math.min(5, Math.max(0, Number(prev.box) || 0)),
                lastSeen: Number(prev.lastSeen) || 0,
                errorGame: -1
            };
            this.data.vocab.push(word);
            this.byKey.set(key, word);
        });

        const sumWordErrors = this.data.vocab.reduce((acc, v) => acc + v.errors, 0);
        this.data.stats.totalErrors = Math.max(this.data.stats.totalErrors, sumWordErrors);

        this.initVoice();
        this.startNewGame('normal');
    },

    serialize() {
        return JSON.stringify({
            version: 16,
            stats: this.data.stats,
            vocab: this.data.vocab
                .filter(v => v.box || v.errors || v.lastSeen)
                .map(v => ({ russian: v.russian, errors: v.errors, box: v.box, lastSeen: v.lastSeen }))
        });
    },

    save() {
        try {
            localStorage.setItem(STORAGE_KEY, this.serialize());
        } catch (e) {
            console.error('Save error:', e);
            if (!this.saveWarned) {
                this.saveWarned = true;
                this.showToast('Speichern nicht möglich (Privatmodus?)');
            }
        }
        this.updateUI();
    },

    /* ---------- FEEDBACK ---------- */

    showToast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    },

    initVoice() {
        if (!('speechSynthesis' in window)) return;
        this.pickVoice();
        window.speechSynthesis.onvoiceschanged = () => this.pickVoice();
    },

    pickVoice() {
        const voices = window.speechSynthesis.getVoices();
        this.voice = voices.find(v => v.lang === 'ru-RU')
            || voices.find(v => /^ru/i.test(v.lang))
            || null;
    },

    speak(text) {
        if (!('speechSynthesis' in window)) return;
        try {
            const synth = window.speechSynthesis;
            if (!this.voice) this.pickVoice();
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ru-RU';
            u.rate = 0.9;
            if (this.voice) {
                u.voice = this.voice;
            } else if (!this.voiceWarned && synth.getVoices().length) {
                this.voiceWarned = true;
                this.showToast('Keine russische Stimme installiert');
            }
            synth.speak(u);
        } catch (e) {}
    },

    /* ---------- NAVIGATION ---------- */

    switchTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + id));

        this.updateUI();
        if (id === 'manage') this.renderVocabList();
        if (id === 'weak' && this.sessions.weak.cards.length === 0) {
            this.startNewGame('weak', true);
        }
    },

    /* ---------- WORTAUSWAHL ---------- */

    makePicker(count) {
        const chosen = [];
        const usedTokens = new Set();
        return {
            chosen,
            full: () => chosen.length >= count,
            add: w => {
                if (!w || chosen.length >= count || chosen.includes(w)) return false;
                if (w.tokens.some(t => usedTokens.has(t))) return false;
                chosen.push(w);
                w.tokens.forEach(t => usedTokens.add(t));
                return true;
            }
        };
    },

    pickNormal(count) {
        const now = this.data.stats.rounds;
        const vocab = this.data.vocab;
        const since = w => now - w.lastSeen;
        const rested = w => !w.lastSeen || since(w) >= 2;
        const p = this.makePicker(count);

        // 1. Bis zu 2 Fehler-Wörter (mit mind. 1 Runde Pause)
        const errorWords = vocab
            .filter(w => w.errors > 0 && rested(w))
            .sort((a, b) => (b.errors - a.errors) || (since(b) - since(a)));
        let errAdded = 0;
        for (const w of errorWords) {
            if (errAdded >= 2) break;
            if (p.add(w)) errAdded++;
        }

        // 2. Fällige Wiederholungen nach Leitner-Intervall (mind. 1 Platz bleibt für Neues)
        const due = vocab
            .filter(w => w.box > 0 && w.lastSeen && since(w) >= BOX_INTERVALS[w.box])
            .map(w => ({ w, prio: since(w) / BOX_INTERVALS[w.box] + Math.random() * 0.5 }))
            .sort((a, b) => b.prio - a.prio);
        for (const { w } of due) {
            if (p.chosen.length >= count - 1) break;
            p.add(w);
        }

        // 3. Neue Wörter in Häufigkeits-Reihenfolge, leicht gemischt
        const fresh = vocab.filter(w => w.box === 0 && w.errors === 0 && rested(w)).slice(0, 12);
        for (const w of shuffle(fresh)) {
            if (p.full()) break;
            p.add(w);
        }

        // 4. Restliche fällige Wörter
        for (const { w } of due) {
            if (p.full()) break;
            p.add(w);
        }

        // 5. Notfall-Auffüllung (z. B. wenn fast alles gelernt ist)
        if (!p.full()) {
            for (const w of shuffle(vocab.filter(rested))) {
                if (p.full()) break;
                p.add(w);
            }
        }
        if (!p.full()) {
            for (const w of shuffle([...vocab])) {
                if (p.full()) break;
                p.add(w);
            }
        }
        return p.chosen;
    },

    pickWeak(count) {
        const p = this.makePicker(count);
        const pool = this.data.vocab
            .filter(w => w.errors > 0)
            .map(w => ({ w, prio: w.errors + Math.random() * 1.5 }))
            .sort((a, b) => b.prio - a.prio);
        pool.forEach(({ w }) => p.add(w));

        if (p.chosen.length === 0) return [];

        // Kleine Fehlerlisten mit bereits gelernten Wörtern auffüllen
        if (p.chosen.length < MIN_WEAK_PAIRS) {
            const filler = shuffle(this.data.vocab.filter(w => w.box > 0 && w.errors === 0));
            for (const w of filler) {
                if (p.chosen.length >= MIN_WEAK_PAIRS) break;
                p.add(w);
            }
        }
        return p.chosen;
    },

    /* ---------- SPIELABLAUF ---------- */

    startNewGame(mode, silent = false) {
        const s = this.sessions[mode];
        clearTimeout(s.nextTimer);

        let selection;
        if (mode === 'weak') {
            selection = this.pickWeak(PAIRS_PER_ROUND);
            if (selection.length === 0) {
                s.cards = [];
                s.selected = null;
                s.locked = false;
                s.gameId = -1;
                this.renderBoard(mode);
                if (!silent) this.showToast('Keine offenen Fehler vorhanden!');
                this.updateUI();
                return;
            }
        } else {
            this.data.stats.rounds++;
            selection = this.pickNormal(PAIRS_PER_ROUND);
        }

        this.data.stats.gameSeq++;
        Object.assign(s, {
            gameId: this.data.stats.gameSeq,
            selected: null,
            locked: false,
            matches: 0,
            totalPairs: selection.length
        });
        selection.forEach(w => { w.lastSeen = this.data.stats.rounds; });

        const ruCards = shuffle(selection.map(w => ({ text: w.russian, type: 'ru', key: w.key, errors: w.errors })));
        const enCards = shuffle(selection.map(w => ({ text: w.english, type: 'en', key: w.key })));
        s.cards = [];
        ruCards.forEach((c, i) => s.cards.push(c, enCards[i]));

        this.renderBoard(mode);

        if (mode === 'normal') {
            document.getElementById('gameProgress').textContent = `0 / ${s.totalPairs} Paare`;
            const errCount = selection.filter(w => w.errors > 0).length;
            const newCount = selection.filter(w => w.box === 0 && w.errors === 0).length;
            const parts = [`Runde ${this.data.stats.rounds}`];
            if (newCount) parts.push(`${newCount} neu`);
            if (errCount) parts.push(`${errCount} Fehler-${errCount === 1 ? 'Wort' : 'Wörter'}`);
            document.getElementById('roundSubtext').textContent = parts.join(' • ');
        }

        this.save();
    },

    renderBoard(mode) {
        const s = this.sessions[mode];
        const board = document.getElementById(s.boardId);
        if (!board) return;
        board.replaceChildren();

        s.cards.forEach((c, idx) => {
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'card';
            el.style.animationDelay = `${idx * 0.025}s`;

            if (c.type === 'ru' && c.errors > 0) {
                const badge = document.createElement('span');
                badge.className = 'card-badge';
                badge.textContent = `${c.errors}×`;
                el.append(badge);
            }

            const text = document.createElement('span');
            text.className = 'card-text';
            text.textContent = c.text;
            el.append(text);

            if (c.type === 'ru') {
                el.lang = 'ru';
                el.insertAdjacentHTML('beforeend', SPEAKER_SVG);
            }

            el.addEventListener('click', () => this.handleCardTap(mode, el, c));
            board.append(el);
        });

        if (mode === 'weak') {
            document.getElementById('weakEmptyHint').style.display = s.cards.length ? 'none' : 'block';
        }
    },

    handleCardTap(mode, el, c) {
        const s = this.sessions[mode];
        if (c.type === 'ru') this.speak(c.text);
        if (s.locked || el.classList.contains('matched')) return;

        // Gleiche Karte erneut -> abwählen
        if (s.selected?.el === el) {
            el.classList.remove('selected');
            s.selected = null;
            return;
        }

        // Gleiche Sprache -> Auswahl wechseln statt Fehler
        if (s.selected && s.selected.data.type === c.type) {
            s.selected.el.classList.remove('selected');
            el.classList.add('selected');
            s.selected = { el, data: c };
            return;
        }

        el.classList.add('selected');
        if (!s.selected) {
            s.selected = { el, data: c };
        } else {
            this.checkMatch(mode, s.selected, { el, data: c });
        }
    },

    checkMatch(mode, a, b) {
        const s = this.sessions[mode];
        const gameId = s.gameId;
        s.locked = true;

        if (a.data.key === b.data.key) {
            setTimeout(() => {
                if (s.gameId !== gameId) return; // Runde wurde inzwischen übersprungen

                a.el.classList.replace('selected', 'matched');
                b.el.classList.replace('selected', 'matched');
                s.matches++;
                s.selected = null;
                s.locked = false;
                this.data.stats.pairsFound++;

                const w = this.byKey.get(a.data.key);
                // Nur hochstufen, wenn das Wort in genau diesem Spiel nicht falsch war
                if (w && w.errorGame !== gameId) {
                    w.box = Math.min(5, w.box + 1);
                    if (w.errors > 0) w.errors--;
                }

                if (mode === 'normal') {
                    document.getElementById('gameProgress').textContent = `${s.matches} / ${s.totalPairs} Paare`;
                }

                if (s.matches >= s.totalPairs) {
                    this.data.stats.completed++;
                    s.locked = true;
                    const weakDone = mode === 'weak' && !this.data.vocab.some(v => v.errors > 0);
                    this.showToast(weakDone
                        ? 'Alle Fehler-Wörter geschafft! 🎉'
                        : `${s.totalPairs}/${s.totalPairs} gelöst – nächste Runde!`);
                    s.nextTimer = setTimeout(() => this.startNewGame(mode, true), 650);
                }
                this.save();
            }, 180);
        } else {
            a.el.classList.add('error');
            b.el.classList.add('error');

            // Fehler auf beide verwechselten Wörter buchen
            [a.data.key, b.data.key].forEach(k => {
                const w = this.byKey.get(k);
                if (w) {
                    w.errors++;
                    w.box = 1;
                    w.errorGame = gameId;
                }
            });

            this.data.stats.totalErrors++;
            this.save();
            this.showToast(`Fehler gespeichert (${this.data.stats.totalErrors} gesamt)`);

            setTimeout(() => {
                a.el.classList.remove('selected', 'error');
                b.el.classList.remove('selected', 'error');
                if (s.gameId !== gameId) return;
                s.selected = null;
                s.locked = false;
            }, 600);
        }
    },

    /* ---------- ANZEIGE ---------- */

    updateUI() {
        const vocab = this.data.vocab;
        const weakWords = vocab.filter(v => v.errors > 0).length;

        const setEl = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
        };

        setEl('statTotalWords', vocab.length);
        setEl('statMastered', vocab.filter(v => v.box === 5).length);
        setEl('statStarted', vocab.filter(v => v.box > 0).length);
        setEl('statRounds', this.data.stats.completed);
        setEl('statErrors', this.data.stats.totalErrors);
        setEl('statPairsFound', this.data.stats.pairsFound);
        setEl('statOpenWeak', weakWords);
        setEl('weakCountDisplay', `${weakWords} ${weakWords === 1 ? 'Wort' : 'Wörter'} mit Fehlern`);

        const badge = document.getElementById('weakBadge');
        if (badge) {
            badge.textContent = weakWords;
            badge.style.display = weakWords > 0 ? 'inline-block' : 'none';
        }
    },

    renderVocabList() {
        const q = norm(document.getElementById('searchInput')?.value || '');
        const filter = document.getElementById('filterSelect')?.value || 'all';
        const list = document.getElementById('vocabListContainer');
        if (!list) return;
        list.replaceChildren();

        let items = this.data.vocab.filter(v => v.key.includes(q) || v.english.toLowerCase().includes(q));

        if (filter === 'errors') items = items.filter(v => v.errors > 0);
        else if (filter === 'learning') items = items.filter(v => v.box > 0 && v.box < 5);
        else if (filter === 'master') items = items.filter(v => v.box === 5);
        else if (filter === 'new') items = items.filter(v => v.box === 0 && v.errors === 0);

        items.sort((a, b) => (b.errors - a.errors) || (a.rank - b.rank));

        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'list-info';
            empty.textContent = 'Keine Einträge gefunden.';
            list.append(empty);
            return;
        }

        const LIMIT = 150;
        items.slice(0, LIMIT).forEach(v => {
            const row = document.createElement('div');
            row.className = 'vocab-item';
            row.addEventListener('click', () => this.speak(v.russian));

            const left = document.createElement('div');
            const ru = document.createElement('strong');
            ru.lang = 'ru';
            ru.textContent = v.russian;
            const box = document.createElement('span');
            box.className = 'box-badge' + (v.box === 5 ? ' master' : '');
            box.textContent = `Box ${v.box}`;
            const en = document.createElement('small');
            en.textContent = v.english;
            left.append(ru, ' 🔊 ', box, document.createElement('br'), en);
            row.append(left);

            if (v.errors > 0) {
                const pill = document.createElement('div');
                pill.className = 'err-pill';
                pill.textContent = `${v.errors}× falsch`;
                row.append(pill);
            }
            list.append(row);
        });

        if (items.length > LIMIT) {
            const info = document.createElement('div');
            info.className = 'list-info';
            info.textContent = `Zeige ${LIMIT} von ${items.length} – Suche nutzen, um weitere zu finden.`;
            list.append(info);
        }
    },

    /* ---------- BACKUP & RESET ---------- */

    exportData() {
        try {
            const blob = new Blob([this.serialize()], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `russisch-trainer-backup-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.append(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (e) {
            this.showToast('Export fehlgeschlagen');
        }
    },

    importData(input) {
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        file.text()
            .then(txt => {
                const parsed = JSON.parse(txt);
                if (!parsed || !Array.isArray(parsed.vocab) || typeof parsed.stats !== 'object') {
                    throw new Error('Ungültiges Format');
                }
                if (!confirm('Aktuellen Fortschritt durch das Backup ersetzen?')) return;
                localStorage.setItem(STORAGE_KEY, txt);
                location.reload();
            })
            .catch(() => this.showToast('Backup konnte nicht gelesen werden'));
    },

    resetStats() {
        if (!confirm('Lernfortschritt wirklich auf 0 zurücksetzen?')) return;
        this.data.stats = { rounds: 0, completed: 0, pairsFound: 0, totalErrors: 0, gameSeq: 0 };
        this.data.vocab.forEach(v => { v.errors = 0; v.box = 0; v.lastSeen = 0; v.errorGame = -1; });
        clearTimeout(this.sessions.weak.nextTimer);
        this.sessions.weak = newSession('weakBoard');
        this.renderBoard('weak');
        this.startNewGame('normal');
        this.showToast('Fortschritt zurückgesetzt');
    },

    hardReset() {
        if (!confirm('Kompletten Speicher löschen und App neu laden?')) return;
        try {
            localStorage.removeItem(STORAGE_KEY);
            OLD_KEYS.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
        location.reload();
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
