<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Russisch Trainer V15</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --sub: #8E8E93;
            --danger: #FF3B30;
            --success: #34C759;
            --warning: #FF9500;
            --radius: 14px;
            --shadow: 0 2px 6px rgba(0,0,0,0.06);
            --gold: #FFB300;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        /* IPHONE 16 PRO MAX SAFE-AREA NAVIGATION */
        .nav-tabs {
            background: #FFFFFF;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            /* Safe-Area für Dynamic Island / Status Bar sauber addieren */
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: 8px;
            padding-right: 8px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 200;
        }
        .tab-btn {
            flex: 1;
            height: 46px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            color: var(--sub);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0 4px;
        }
        .tab-btn.active {
            color: var(--primary);
            font-weight: 700;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }
        .badge {
            background: var(--danger);
            color: white;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
        }

        /* CONTENT AREA */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 14px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
            overflow-y: auto;
        }
        .tab-content.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-shrink: 0;
            background: #FFF;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        /* KOMPAKTERE KARTEN FÜR ANGENEHMES TIPPEN */
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: minmax(62px, 72px);
            gap: 10px;
            align-content: start;
            width: 100%;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-align: center;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: transform 0.1s ease, border-color 0.12s ease, background-color 0.12s ease, opacity 0.2s ease;
            touch-action: manipulation;
            padding: 6px 10px;
            height: 100%;
            width: 100%;
        }
        .card:active {
            transform: scale(0.96);
        }
        .card.selected {
            border-color: var(--primary);
            background-color: #E8F2FF;
        }
        .card.matched {
            background-color: #E5F9E7;
            border-color: var(--success);
            opacity: 0.2;
            pointer-events: none;
            transform: scale(0.95);
        }
        .card.error {
            background-color: var(--danger);
            border-color: var(--danger);
            animation: shake 0.35s;
        }
        .card.error .card-text,
        .card.error .speaker-icon,
        .card.error .card-badge {
            color: #FFF !important;
        }
        .card-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.2;
            word-break: break-word;
        }
        .speaker-icon {
            color: var(--sub);
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }
        .card.selected .speaker-icon {
            color: var(--primary);
        }
        .card-badge {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--danger);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn:active {
            opacity: 0.8;
        }

        /* VOKABELLISTE */
        .vocab-list {
            background: white;
            border-radius: var(--radius);
            overflow-y: auto;
            box-shadow: var(--shadow);
            flex: 1;
        }
        .vocab-item {
            padding: 11px 14px;
            border-bottom: 1px solid #EFEFF4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }
        .box-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            background: #EFEFF4;
            color: #666;
            margin-left: 6px;
            font-weight: 600;
        }
        .box-badge.master {
            background: var(--gold);
            color: #fff;
        }

        /* PROFIL / STATISTIKEN */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: white;
            padding: 16px 12px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-num {
            font-size: 26px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        /* TOAST FEEDBACK */
        #toast {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(28,28,30,0.92);
            color: white;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 999;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<nav class="nav-tabs">
    <button class="tab-btn active" onclick="app.switchTab('game')">Spiel</button>
    <button class="tab-btn" onclick="app.switchTab('weak')">
        Training <span id="weakBadge" class="badge" style="display:none">0</span>
    </button>
    <button class="tab-btn" onclick="app.switchTab('manage')">Liste</button>
    <button class="tab-btn" onclick="app.switchTab('stats')">Profil</button>
</nav>

<div class="content-area">
    <!-- TAB 1: SPIEL -->
    <div id="tab-game" class="tab-content active">
        <div class="game-header">
            <div>
                <div style="font-weight:700; font-size:15px" id="gameProgress">0 / 5 Paare</div>
                <div style="color:var(--sub); font-size:12px" id="roundSubtext">Runde 1 • V15 Smart-SRS</div>
            </div>
            <button class="btn" onclick="app.startNewGame('normal')">Überspringen ↻</button>
        </div>
        <div id="gameBoard" class="game-grid"></div>
    </div>

    <!-- TAB 2: FEHLER-TRAINING -->
    <div id="tab-weak" class="tab-content">
        <div class="game-header">
            <div>
                <div style="font-weight:700; font-size:15px">Fehler-Training</div>
                <div style="color:var(--sub); font-size:12px" id="weakCountDisplay">0 Wörter mit Fehlern</div>
            </div>
            <button class="btn" id="btnStartWeak" onclick="app.startNewGame('weak')">Starten ▶</button>
        </div>
        <div id="weakBoard" class="game-grid"></div>
        <div id="weakEmptyHint" style="border: 2px dashed #D1D1D6; border-radius: 14px; padding: 30px 20px; text-align: center; color: var(--sub); font-size: 14px; margin-top: 10px;">
            Sobald du im Spiel ein Wortpaar verwechselst, wird es hier gespeichert und kann gezielt geübt werden.
        </div>
    </div>

    <!-- TAB 3: LISTE -->
    <div id="tab-manage" class="tab-content">
        <div style="display:flex; gap:8px; margin-bottom:10px; flex-shrink:0;">
            <input type="text" id="searchInput" placeholder="Wort suchen..." style="flex:1; padding:10px 12px; border:none; background:#E5E5EA; border-radius:10px; font-size:14px;" oninput="app.renderVocabList()">
            <select id="filterSelect" onchange="app.renderVocabList()" style="padding:0 10px; border:none; background:#FFF; border-radius:10px; font-weight:600; font-size:13px; color:var(--text);">
                <option value="all">Alle (Fehler zuerst)</option>
                <option value="errors">Nur Fehler</option>
                <option value="master">Meister (Box 5)</option>
            </select>
        </div>
        <div class="vocab-list" id="vocabListContainer"></div>
    </div>

    <!-- TAB 4: PROFIL -->
    <div id="tab-stats" class="tab-content">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-num" style="color:var(--primary)" id="statTotalWords">0</span>
                <span style="font-size:11px;color:var(--sub);font-weight:600">VOKABELN GESAMT</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" style="color:var(--gold)" id="statMastered">0</span>
                <span style="font-size:11px;color:var(--sub);font-weight:600">MEISTER (BOX 5)</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" style="color:var(--success)" id="statRounds">0</span>
                <span style="font-size:11px;color:var(--sub);font-weight:600">RUNDEN GESPIELT</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" style="color:var(--danger)" id="statErrors">0</span>
                <span style="font-size:11px;color:var(--sub);font-weight:600">FEHLER GESAMT</span>
            </div>
        </div>

        <div class="stat-card" style="margin-top:10px; display:flex; justify-content:space-around; align-items:center; padding:14px">
            <div>
                <span style="font-size:11px;color:var(--sub);font-weight:600">GELÖSTE PAARE</span>
                <strong style="display:block;font-size:20px;margin-top:2px;color:var(--text)" id="statPairsFound">0</strong>
            </div>
            <div style="height:30px;width:1px;background:#E5E5EA"></div>
            <div>
                <span style="font-size:11px;color:var(--sub);font-weight:600">AKTUELLE FEHLER-WÖRTER</span>
                <strong style="display:block;font-size:20px;margin-top:2px;color:var(--danger)" id="statOpenWeak">0</strong>
            </div>
        </div>

        <div style="margin-top:auto; gap:10px; display:flex; flex-direction:column; padding-top:16px">
            <button class="btn" style="background:#8E8E93; padding:12px" onclick="app.resetStats()">Lernfortschritt zurücksetzen</button>
            <button class="btn" style="background:var(--danger); padding:12px" onclick="app.hardReset()">Kompletten Speicher löschen</button>
        </div>
    </div>
</div>

<div id="toast"></div>

const STORAGE_KEY = 'ru_trainer_v15_pro';
const OLD_KEYS = ['ru_trainer_v14_smart', 'ru_trainer_v13_hardened'];

const app = {
    data: {
        vocab: [],
        stats: { rounds: 0, pairsFound: 0, totalErrors: 0 }
    },
    state: {
        cards: [],
        selected: null,
        locked: false,
        matches: 0,
        totalPairs: 0,
        mode: 'normal',
        toastTimer: null
    },

    init() {
        let rawStored = localStorage.getItem(STORAGE_KEY);
        if (!rawStored) {
            for (const k of OLD_KEYS) {
                if (localStorage.getItem(k)) {
                    rawStored = localStorage.getItem(k);
                    break;
                }
            }
        }

        let savedMap = {};
        if (rawStored) {
            try {
                const parsed = JSON.parse(rawStored);
                this.data.stats = {
                    rounds: Number(parsed.stats?.rounds) || 0,
                    pairsFound: Number(parsed.stats?.pairsFound) || 0,
                    totalErrors: Number(parsed.stats?.totalErrors) || 0
                };
                if (Array.isArray(parsed.vocab)) {
                    parsed.vocab.forEach(v => {
                        if (v && v.russian) {
                            savedMap[String(v.russian).trim()] = {
                                errors: Number(v.errors) || 0,
                                box: Number(v.box) || 0,
                                lastSeen: Number(v.lastSeen) || 0,
                                lastErrorRound: Number(v.lastErrorRound) || 0
                            };
                        }
                    });
                }
            } catch (e) {
                console.warn('Fehler beim Laden:', e);
            }
        }

        const seen = new Set();
        this.data.vocab = [];
        RAW_VOCAB.forEach(pair => {
            const ru = String(pair[0]).trim();
            const en = String(pair[1]).trim();
            if (!seen.has(ru)) {
                seen.add(ru);
                const prev = savedMap[ru] || { errors: 0, box: 0, lastSeen: 0, lastErrorRound: 0 };
                this.data.vocab.push({
                    russian: ru,
                    english: en,
                    errors: prev.errors,
                    box: prev.box,
                    lastSeen: prev.lastSeen,
                    lastErrorRound: prev.lastErrorRound
                });
            }
        });

        // Falls totalErrors durch den alten Bug auf 0 hing, aber Wörter Fehler haben, synchronisieren:
        const sumWordErrors = this.data.vocab.reduce((acc, v) => acc + (v.errors || 0), 0);
        if (this.data.stats.totalErrors < sumWordErrors) {
            this.data.stats.totalErrors = sumWordErrors;
        }

        this.save();
        this.startNewGame('normal');
    },

    save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
        } catch (e) {
            console.error('Save error:', e);
        }
        this.updateUI();
    },

    showToast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(this.state.toastTimer);
        this.state.toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    },

    speak(text) {
        if (!('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ru-RU';
            u.rate = 0.95;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    },

    switchTab(id) {
        const tabs = ['game', 'weak', 'manage', 'stats'];
        document.querySelectorAll('.tab-btn, .tab-content').forEach(e => e.classList.remove('active'));
        const idx = tabs.indexOf(id);
        if (idx !== -1) document.querySelectorAll('.tab-btn')[idx].classList.add('active');
        const target = document.getElementById('tab-' + id);
        if (target) target.classList.add('active');

        this.updateUI();
        if (id === 'manage') this.renderVocabList();
        if (id === 'weak') {
            const hasErrors = this.data.vocab.some(v => v.errors > 0);
            if (hasErrors && this.state.mode !== 'weak') {
                this.startNewGame('weak');
            }
        }
    },

    pickSmartSelection(count = 5) {
        const nextRound = this.data.stats.rounds + 1;
        const all = [...this.data.vocab];
        const chosen = [];
        const chosenSet = new Set();

        const addWord = (w) => {
            if (w && !chosenSet.has(w.russian) && chosen.length < count) {
                chosen.push(w);
                chosenSet.add(w.russian);
            }
        };

        // 1. Bis zu 2 Fehler-Wörter einstreuen (bevorzugt solche, die mindestens 1 Runde Pause hatten)
        const errorWords = all.filter(v => v.errors > 0).sort((a, b) => {
            const pauseA = (nextRound - (a.lastSeen || 0)) >= 2 ? 1 : 0;
            const pauseB = (nextRound - (b.lastSeen || 0)) >= 2 ? 1 : 0;
            if (pauseB !== pauseA) return pauseB - pauseA;
            return b.errors - a.errors;
        });
        errorWords.slice(0, 2).forEach(addWord);

        // 2. Restliche Plätze auffüllen (keine direkten Wiederholungen aus der Vorrunde)
        const rest = all.filter(v => !chosenSet.has(v.russian));
        rest.forEach(v => {
            const since = nextRound - (v.lastSeen || 0);
            const cooldownPenalty = (v.lastSeen > 0 && since <= 2) ? -600 : Math.min(since * 10, 150);
            const boxPriority = v.box === 0 ? 130 : (6 - v.box) * 40;
            const errBonus = (v.errors || 0) * 85;
            v._score = boxPriority + errBonus + cooldownPenalty + (Math.random() * 60);
        });

        rest.sort((a, b) => b._score - a._score);
        for (const w of rest) {
            if (chosen.length >= count) break;
            addWord(w);
        }
        return chosen;
    },

    startNewGame(mode) {
        this.state.mode = mode;
        this.state.matches = 0;
        this.state.selected = null;
        this.state.locked = false;

        let selection = [];
        const weakBoard = document.getElementById('weakBoard');
        const weakHint = document.getElementById('weakEmptyHint');

        if (mode === 'weak') {
            const pool = this.data.vocab.filter(v => v.errors > 0);
            if (pool.length === 0) {
                if (weakBoard) weakBoard.innerHTML = '';
                if (weakHint) weakHint.style.display = 'block';
                this.showToast('Keine offenen Fehler vorhanden!');
                return;
            }
            if (weakHint) weakHint.style.display = 'none';
            pool.sort((a, b) => (b.errors * 25 + Math.random() * 20) - (a.errors * 25 + Math.random() * 20));
            selection = pool.slice(0, Math.min(5, pool.length));
        } else {
            selection = this.pickSmartSelection(5);
            this.data.stats.rounds++;
        }

        this.state.totalPairs = selection.length;
        selection.forEach(w => { w.lastSeen = this.data.stats.rounds; });

        const ruCards = selection.map(w => ({ text: w.russian, type: 'ru', pairId: w.russian, errors: w.errors }));
        const enCards = selection.map(w => ({ text: w.english, type: 'en', pairId: w.russian, errors: w.errors }));

        const shuffle = (arr) => {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        };
        shuffle(ruCards);
        shuffle(enCards);

        this.state.cards = [];
        for (let i = 0; i < this.state.totalPairs; i++) {
            this.state.cards.push(ruCards[i]);
            this.state.cards.push(enCards[i]);
        }

        const container = document.getElementById(mode === 'weak' ? 'weakBoard' : 'gameBoard');
        this.renderBoard(container);

        if (mode === 'normal') {
            document.getElementById('gameProgress').textContent = `0 / ${this.state.totalPairs} Paare`;
            const errCount = selection.filter(w => w.errors > 0).length;
            document.getElementById('roundSubtext').textContent = errCount > 0
                ? `Runde ${this.data.stats.rounds} • ${errCount} Fehler-Wort dabei`
                : `Runde ${this.data.stats.rounds} • V15 Smart-SRS`;
        }

        this.save();
    },

    renderBoard(container) {
        if (!container) return;
        container.innerHTML = '';
        this.state.cards.forEach((c, idx) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.style.animation = `fadeIn 0.2s ease backwards ${idx * 0.025}s`;

            const badge = (c.type === 'ru' && c.errors > 0)
                ? `<span class="card-badge">${c.errors}×</span>`
                : '';

            const speaker = c.type === 'ru'
                ? `<svg class="speaker-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`
                : '';

            el.innerHTML = `${badge}<div class="card-text">${c.text}</div>${speaker}`;
            el.onclick = () => this.handleCardTap(el, c);
            container.appendChild(el);
        });
    },

    handleCardTap(el, c) {
        if (c.type === 'ru') this.speak(c.text);
        if (this.state.locked || el.classList.contains('matched')) return;

        if (this.state.selected?.el === el) {
            el.classList.remove('selected');
            this.state.selected = null;
            return;
        }

        // Gleiche Sprache nochmal getippt -> Auswahl wechseln statt Fehler
        if (this.state.selected && this.state.selected.data.type === c.type) {
            this.state.selected.el.classList.remove('selected');
            el.classList.add('selected');
            this.state.selected = { el, data: c };
            return;
        }

        el.classList.add('selected');
        if (!this.state.selected) {
            this.state.selected = { el, data: c };
        } else {
            this.checkMatch(this.state.selected, { el, data: c });
        }
    },

    checkMatch(c1, c2) {
        this.state.locked = true;
        const isMatch = c1.data.pairId === c2.data.pairId;

        if (isMatch) {
            setTimeout(() => {
                c1.el?.classList.replace('selected', 'matched');
                c2.el?.classList.replace('selected', 'matched');

                this.state.matches++;
                this.state.selected = null;
                this.state.locked = false;
                this.data.stats.pairsFound++;

                if (this.state.mode === 'normal') {
                    document.getElementById('gameProgress').textContent = `${this.state.matches} / ${this.state.totalPairs} Paare`;
                }

                const wordObj = this.data.vocab.find(v => v.russian === c1.data.pairId);
                if (wordObj) {
                    // Nur hochstufen und Fehler abbauen, wenn es nicht in genau dieser Runde falsch war
                    if (wordObj.lastErrorRound !== this.data.stats.rounds) {
                        wordObj.box = Math.min(5, (wordObj.box || 0) + 1);
                        if (wordObj.errors > 0) wordObj.errors--;
                    }
                }
                this.save();

                // AUTOMATISCHER WEITERLEITUNGS-FLOW OHNE KLICK
                if (this.state.matches >= this.state.totalPairs) {
                    this.showToast('5/5 gelöst – Nächste Runde!');
                    setTimeout(() => {
                        this.startNewGame(this.state.mode);
                    }, 650);
                }
            }, 180);
        } else {
            c1.el?.classList.add('error');
            c2.el?.classList.add('error');

            // Fehler sofort auf beide beteiligten Wortpaare buchen
            const w1 = this.data.vocab.find(v => v.russian === c1.data.pairId);
            const w2 = this.data.vocab.find(v => v.russian === c2.data.pairId);

            [w1, w2].forEach(w => {
                if (w) {
                    w.errors = (Number(w.errors) || 0) + 1;
                    w.box = 1;
                    w.lastErrorRound = this.data.stats.rounds;
                }
            });

            this.data.stats.totalErrors = (Number(this.data.stats.totalErrors) || 0) + 1;
            this.save();
            this.showToast(`Fehler gespeichert (${this.data.stats.totalErrors} gesamt)`);

            setTimeout(() => {
                c1.el?.classList.remove('selected', 'error');
                c2.el?.classList.remove('selected', 'error');
                this.state.selected = null;
                this.state.locked = false;
            }, 600);
        }
    },

    updateUI() {
        const total = this.data.vocab.length;
        const weakWords = this.data.vocab.filter(v => (v.errors || 0) > 0).length;
        const mastered = this.data.vocab.filter(v => v.box === 5).length;

        const setEl = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
        };

        setEl('statTotalWords', total);
        setEl('statMastered', mastered);
        setEl('statRounds', this.data.stats.rounds);
        setEl('statErrors', this.data.stats.totalErrors);
        setEl('statPairsFound', this.data.stats.pairsFound);
        setEl('statOpenWeak', weakWords);
        setEl('weakCountDisplay', `${weakWords} ${weakWords === 1 ? 'Wort' : 'Wörter'} mit Fehlern`);

        const badge = document.getElementById('weakBadge');
        if (badge) {
            if (weakWords > 0) {
                badge.textContent = weakWords;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
    },

    renderVocabList() {
        const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
        const filter = document.getElementById('filterSelect')?.value || 'all';
        const list = document.getElementById('vocabListContainer');
        if (!list) return;
        list.innerHTML = '';

        let items = this.data.vocab.filter(v =>
            v.russian.toLowerCase().includes(q) || v.english.toLowerCase().includes(q)
        );

        if (filter === 'errors') {
            items = items.filter(v => v.errors > 0);
        } else if (filter === 'master') {
            items = items.filter(v => v.box === 5);
        }

        // Standardmäßig Wörter mit Fehlern immer ganz oben anzeigen!
        items.sort((a, b) => (b.errors || 0) - (a.errors || 0));

        if (items.length === 0) {
            list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--sub)">Keine Einträge gefunden.</div>`;
            return;
        }

        items.slice(0, 100).forEach(v => {
            const row = document.createElement('div');
            row.className = 'vocab-item';
            const boxClass = v.box === 5 ? 'master' : '';
            row.innerHTML = `
                <div onclick="app.speak('${v.russian.replace(/'/g, "\\'")}')" style="cursor:pointer; flex:1">
                    <strong>${v.russian}</strong> 🔊 <span class="box-badge ${boxClass}">Box ${v.box || 0}</span><br>
                    <small style="color:var(--sub)">${v.english}</small>
                </div>
                ${v.errors > 0 ? `<div style="background:var(--danger);color:#fff;padding:4px 9px;border-radius:10px;font-size:12px;font-weight:700">${v.errors}× falsch</div>` : ''}
            `;
            list.appendChild(row);
        });
    },

    resetStats() {
        if (confirm('Lernfortschritt wirklich auf 0 zurücksetzen?')) {
            this.data.stats = { rounds: 0, pairsFound: 0, totalErrors: 0 };
            this.data.vocab.forEach(v => { v.errors = 0; v.box = 0; v.lastSeen = 0; v.lastErrorRound = 0; });
            this.save();
            this.startNewGame('normal');
            this.showToast('Fortschritt zurückgesetzt');
        }
    },

    hardReset() {
        if (confirm('Kompletten Speicher löschen und App neu laden?')) {
            localStorage.removeItem(STORAGE_KEY);
            OLD_KEYS.forEach(k => localStorage.removeItem(k));
            location.reload();
        }
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
